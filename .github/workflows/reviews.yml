name: Collect Google reviews

# Reads each store's running Google rating count once a day and commits the
# reading back, so the live app shows yesterday's reviews without anybody
# opening a laptop.
#
# ★★ WHY THIS EXISTS. It ran as a launchd job on Manav's Mac. That worked, and
# it had two faults a schedule on a server does not: the Space only ever saw
# what happened to be committed, so the tab's figures went stale between
# pushes; and the job missed mornings — 24 and 25 August, then 4 September,
# when a pandas import hit `OSError: Resource deadlock avoided`. A missed
# morning cannot be recovered: the count is a running LEVEL, so the next
# reading silently covers two days.
#
# ★ THE READING IS THE STATE, SO IT HAS TO BE COMMITTED. A runner starts from a
# fresh checkout. An uncommitted CSV is not memory, it is an empty file that
# thinks collection began today — the same trap the WhatsApp sender's sent-log
# has, for the same reason.
#
# ⚠️ THIS REPO IS PUBLIC. The key lives in repository secrets and is never
# echoed; the workflow refuses to run from a fork, and there is no
# `pull_request` trigger, so a pull request cannot reach the secret.
#
# ⚠️ AND IT COMMITS TO main. `[skip ci]` keeps it from starting a test run for
# one CSV row per store, and the rebase-then-push handles the case where a real
# push landed while this was reading.

on:
  # ★★ THE SCHEDULE WAS REMOVED 10 SEP 2026 — IT NEVER ONCE FIRED. Two slots a
  # day (`37 2` and `37 8`) produced not a single scheduled run. Measured
  # against `keep-warm.yml`, which asks every 15 minutes and fired 9 times in
  # ~150 slots: GitHub drops roughly 94% of this repo's scheduled runs, so two
  # slots had about a one-in-eight chance of either landing, and a missed
  # morning cannot be backfilled — the count is a running LEVEL.
  #
  # The collection now rides on `keep-warm.yml`, the one schedule GitHub does
  # honour, guarded so it reads once a day. THIS file stays for MANUAL runs and
  # is deliberately NOT gated: a manual run means "read it again now".
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two runs appending the same day would fight over the file. One at a time.
  group: collect-reviews
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    if: github.repository == 'M4NAVV/peanuts-blr-dashboard'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "pandas==2.2.3" "numpy==1.26.4" requests

      - name: Read the counts
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "NOT COLLECTED: GOOGLE_MAPS_API_KEY is not set in this"
            echo "repository's secrets, so today's reading cannot be taken."
            exit 1
          fi
          python scripts_collect_reviews.py

      - name: Commit the reading
        run: |
          git config user.name  "peanuts-reviews"
          git config user.email "reviews@peanuts.invalid"
          git add review_snapshots.csv
          # Nothing to commit is not a failure: a re-run on the same day finds
          # the row already there.
          if git diff --cached --quiet; then
            echo "no change — today's reading is already on file"
            exit 0
          fi
          git commit -m "Google review counts $(date -u +%F) [skip ci]"
          # A real push may have landed while this was reading; rebase rather
          # than clobber, because both are true.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
