name: Tests

# Runs the repo's tests on every push and pull request.
#
# They are deliberately cheap: the suite works on synthetic frames, so it needs
# no sheet, no secret and no network — only pandas, pinned to the same versions
# the app runs on. A run finishes in well under a minute.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # the version the Space builds on

      - name: Install the data libraries the tests need
        run: |
          python -m pip install --upgrade pip
          pip install "pandas==2.2.3" "numpy==1.26.4" pytest

      - name: Run the tests
        run: python -m pytest tests -q
