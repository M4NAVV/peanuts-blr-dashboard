[theme]
primaryColor = "#7A1F2B"
backgroundColor = "#FAF7F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2B2B2B"
font = "sans serif"

[server]
headless = true
# No hot-reload needed in production (files never change at runtime). Disabling
# the source-file watcher also avoids Streamlit's `KeyError: '<module>'` from its
# module watcher resolving sys.modules by name after a redeploy.
fileWatcherType = "none"
